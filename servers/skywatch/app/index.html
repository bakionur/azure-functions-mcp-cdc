<!doctype html>
<html><head><meta charset="utf-8"><title>SkyWatch Radar</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font-family: Inter, system-ui, sans-serif; background:#1c1108; color:#fbf4ec; }
  .wrap { display:flex; gap:16px; padding:12px; align-items:flex-start; flex-wrap:wrap; }
  canvas { background:#1c1108; border-radius:12px; }
  table { border-collapse:collapse; font-size:13px; }
  td, th { padding:4px 8px; border-bottom:1px solid #4a3320; text-align:left; }
  th { color:#f08a4b; }
  .pill { background:#d4460c; border-radius:999px; padding:2px 10px; font-size:12px; }
  h3 { margin:0 0 8px; font-weight:600; }
  .dim { color:#b8a08c; font-size:11px; font-weight:400; }
</style></head>
<body>
  <div class="wrap">
    <canvas id="radar" width="420" height="420"></canvas>
    <div>
      <h3 id="title">Waiting for flights_overhead…</h3>
      <div id="meta"></div>
      <table id="list"></table>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body></html>
